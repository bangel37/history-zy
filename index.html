<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>历史中考 · 定位记忆助手</title>
<style>
:root{
  --bg:#F6F3EC; --card:#FFFFFF; --ink:#262220; --sub:#7A6F65;
  --red:#9B2E2E; --red-soft:#F3E3E3; --green:#2E7D5B; --green-soft:#E2F0E9;
  --line:#E4DDD2; --blue:#2F5D77; --blue-soft:#E8F0F7;
  --chip:#F7F4EE; --warn:#FBE9E9; --warn-line:#C86B6B; --warn-ink:#A33;
  --amber:#FDF3E3; --amber-line:#DDB77A; --amber-ink:#8A5A1B;
  --bar:#EDE8DF; --sel:#EDF4FA; --note:#FFFDF7;
}
[data-theme="dark"]{
  --bg:#1E1B18; --card:#2A2622; --ink:#EAE4DC; --sub:#A2968A;
  --red:#B04A4A; --red-soft:#452A2A; --green:#5BA983; --green-soft:#25382F;
  --line:#3D372F; --blue:#7FA8C0; --blue-soft:#2C3A45;
  --chip:#332E28; --warn:#452A2A; --warn-line:#8C4A4A; --warn-ink:#E09A9A;
  --amber:#443626; --amber-line:#8A6A3A; --amber-ink:#DDB77A;
  --bar:#3D372F; --sel:#2E3B46; --note:#2A2622;
}
[data-theme="dark"] header{box-shadow:0 2px 10px rgba(0,0,0,.5)}
[data-theme="dark"] .card{box-shadow:0 1px 3px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.6;padding-bottom:40px}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{background:var(--red);color:#fff;padding:14px 0 12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
header h1{margin:0;font-size:18px;letter-spacing:1px;font-weight:600}
header .sub{font-size:12px;opacity:.85;margin-top:2px}
.badges{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.badge{background:rgba(255,255,255,.16);border-radius:20px;padding:3px 11px;font-size:12.5px}
nav{display:flex;gap:6px;margin:12px 0 8px;flex-wrap:wrap}
nav button{flex:1;min-width:64px;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:9px 4px;font-size:14px;color:var(--sub);cursor:pointer;font-family:inherit}
nav button.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
select{font-family:inherit;font-size:14px;padding:7px 8px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
  box-shadow:0 1px 3px rgba(0,0,0,.04)}
.hidden{display:none!important}
.big{font-size:26px;font-weight:600;letter-spacing:1px;margin:6px 0 14px;word-break:break-word}
.qhint{color:var(--sub);font-size:14px}
.path{color:var(--blue);font-size:14px;font-weight:600;line-height:1.8}
.path .u{color:var(--sub);font-weight:400}
.items{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.items li{background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:13.5px}
.items li.hi{background:var(--red-soft);border-color:var(--red);color:var(--red);font-weight:600}
.items li.ok{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.items li.no{background:var(--warn);border-color:var(--warn-line);color:var(--warn-ink)}
.btn{display:block;width:100%;padding:13px 12px;margin-top:9px;border-radius:11px;border:1px solid var(--line);
  background:var(--card);font-size:15.5px;font-family:inherit;cursor:pointer;color:var(--ink);text-align:left;line-height:1.45}
.btn:active{transform:scale(.995)}
.btn.sel{background:var(--sel);border-color:var(--blue);color:var(--blue)}
.btn.correct{background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.btn.wrong{background:var(--warn);border-color:var(--warn-line);color:var(--warn-ink);text-decoration:line-through}
.row{display:flex;gap:9px;margin-top:14px}
.row .btn{margin-top:0;text-align:center}
.g0{background:var(--warn);border-color:var(--warn-line);color:var(--red)}
.g1{background:var(--amber);border-color:var(--amber-line);color:var(--amber-ink)}
.g2{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.g3{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.primary{background:var(--red);border-color:var(--red);color:#fff;text-align:center;font-weight:600}
.meta{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--red)}
.stat span{font-size:12px;color:var(--sub)}
.bar{height:9px;background:var(--bar);border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--green);border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:500;font-size:13px}
details{border-bottom:1px solid var(--line);padding:8px 0}
summary{cursor:pointer;font-size:15px;font-weight:600;outline:none}
summary::marker{color:var(--red)}
.note{color:var(--sub);font-size:13.5px;background:var(--note);border:1px dashed var(--line);
  border-radius:10px;padding:11px 13px;margin-top:12px}
input[type=search]{width:100%;font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--card);color:var(--ink)}
.hit{padding:10px 0;border-bottom:1px solid var(--line)}
.hit .t{font-weight:600}
.weak{display:flex;justify-content:space-between;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line)}
.weak span:last-child{color:var(--red);font-weight:600}
.foot{color:var(--sub);font-size:12.5px;text-align:center;margin:26px 0 10px}
.kbd{display:inline-block;background:var(--bar);border-radius:4px;padding:0 5px;font-size:12px}
#printArea{display:none}
@media print{
  body{background:#fff}
  body>*{display:none!important}
  #printArea{display:block!important}
  #printArea table{width:100%;border-collapse:collapse}
  #printArea td{border:1px solid #999;padding:10px;font-size:15px;height:34px}
}
</style>
</head>
<body>
<header>
  <div class="wrap" style="position:relative">
    <button id="themeBtn" style="position:absolute;right:0;top:0;background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:9px;padding:5px 10px;cursor:pointer;font-size:13.5px;font-family:inherit">🌙 深色</button>
    <h1>历史中考 · 定位记忆助手</h1>
    <div class="sub">把「知道它在哪一课」练成条件反射</div>
    <div class="badges" id="badges"></div>
  </div>
</header>

<div class="wrap">
  <nav>
    <button data-v="study" class="on">闪卡</button>
    <button data-v="locate">定位</button>
    <button data-v="group">归类</button>
    <button data-v="find">检索</button>
    <button data-v="stat">统计</button>
  </nav>

  <div class="filters" id="filters">
    <select id="fBook"></select>
    <select id="fUnit"></select>
    <button id="btnPrint" style="display:none"></button>
  </div>

  <!-- 闪卡 -->
  <section id="v-study">
    <div class="row" id="errBar" style="display:none">
      <button class="btn" id="errExit" style="border-color:var(--red);color:var(--red);text-align:center;font-weight:600">✕ 退出错题重练</button>
    </div>
    <div class="meta"><span id="sProgress"></span><span id="sCount"></span></div>
    <div class="card" id="sCard"></div>
    <div class="row" id="sGrade" style="display:none">
      <button class="btn g0" data-g="0">忘了<br><small>1分钟后再来</small></button>
      <button class="btn g1" data-g="1">模糊<br><small>明天再来</small></button>
      <button class="btn g2" data-g="2">记住<br><small>拉长间隔</small></button>
    </div>
    <div class="row"><button class="btn primary" id="sFlip">翻面看答案（空格）</button></div>
    <div class="note">先盯着上面的词，<b>在脑子里说出它在第几册第几单元</b>，再翻面。说不出来就按「忘了」——这一下最值钱。</div>
  </section>

  <!-- 定位 -->
  <section id="v-locate" class="hidden">
    <div class="meta"><span id="lProgress"></span><span id="lScore"></span></div>
    <div class="card">
      <div class="qhint">这个考点在——</div>
      <div class="big" id="lQ">—</div>
      <div id="lOpts"></div>
      <div id="lFB"></div>
    </div>
    <div class="row"><button class="btn primary" id="lNext" style="display:none">下一题</button></div>
    <div class="row"><button class="btn" id="lStart">开始一组（10题）</button></div>
  </section>

  <!-- 归类 -->
  <section id="v-group" class="hidden">
    <div class="meta"><span id="gProgress"></span><span id="gScore"></span></div>
    <div class="card">
      <div class="qhint">下面哪些考点属于——</div>
      <div class="path" id="gQ" style="margin:8px 0 14px">—</div>
      <div id="gOpts"></div>
      <div id="gFB"></div>
    </div>
    <div class="row"><button class="btn" id="gSubmit" style="display:none">提交（<span id="gSel">0</span>）</button></div>
    <div class="row"><button class="btn primary" id="gNext" style="display:none">下一课</button></div>
    <div class="row"><button class="btn" id="gStart">开始一组（8课）</button></div>
  </section>

  <!-- 检索 -->
  <section id="v-find" class="hidden">
    <input type="search" id="fq" placeholder="搜考点 / 人物 / 事件，比如「商鞅」「南京条约」">
    <div id="fRes" style="margin-top:12px"></div>
    <div class="card" style="margin-top:14px" id="fTree"></div>
  </section>

  <!-- 统计 -->
  <section id="v-stat" class="hidden">
    <div class="stats" id="stNums"></div>
    <div class="card">
      <b>各册掌握度</b>
      <div id="stBooks" style="margin-top:10px"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <b>最需要补的单元</b>
      <div id="stWeak" style="margin-top:6px"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <b>错得最多的考点 TOP15</b>
      <div id="stLapse" style="margin-top:6px"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <b>错题重练</b>
      <div style="margin-top:8px;color:var(--sub);font-size:13.5px">答错的考点会自动进错题本，在闪卡里答对（按「记住」）后自动移出。</div>
      <div class="row"><button class="btn primary" id="btnError">错题重练（<span id="errN">0</span>）</button></div>
    </div>
    <div class="card" style="margin-top:12px">
      <b>设置</b>
      <div style="margin-top:10px;display:flex;gap:9px;align-items:center;flex-wrap:wrap">
        <span style="font-size:14px;color:var(--sub)">每日新考点上限</span>
        <select id="setNew">
          <option>10</option><option>15</option><option>20</option><option>30</option><option>50</option>
        </select>
      </div>
      <div class="row">
        <button class="btn" id="btnExport">导出进度</button>
        <button class="btn" id="btnImport">导入进度</button>
      </div>
      <div class="row"><button class="btn" id="btnReset" style="color:var(--red)">清空全部进度</button></div>
      <input type="file" id="fileIn" accept="application/json" style="display:none">
    </div>
    <div class="note">进度只保存在这台设备的浏览器里（localStorage）。换设备或清缓存前，记得先「导出进度」。</div>
  </section>

  <div class="foot">共 <span id="totN"></span> 个考点 · 数据来自老师下发的目录提纲对照表</div>
</div>

<div id="printArea"></div>

function tick(){ S.lastDay=today(); S.log[today()]=(S.log[today()]||0)+1; save(); }
function pathOf(a){const l=LMAP[a.lid];
  return '第'+CN[l.book]+'册 › 第'+CN[l.unit]+'单元 '+l.unitName+' › 第'+l.lesson+'课';}
function optOf(l){return '第'+CN[l.book]+'册 · 第'+CN[l.unit]+'单元 '+l.unitName+' · 第'+l.lesson+'课';}
function fullUnit(l){const t=l.unitTitle||l.unitName;return t===l.unitName?l.unitName:l.unitName+'（'+t.split(/[:：]/).slice(1).join('：')+'）';}

/* ---------- 记忆算法（SM-2 简化） ---------- */
function review(k,g){
  let c=S.cards[k];
  if(!c){c=S.cards[k]={e:2.5,i:0,r:0,l:0,d:0};}
  const fresh = c.r===0;
  if(g===0){c.r=0;c.i=0;c.l=(c.l||0)+1;c.d=today();c.w=1;}
  else{
    c.r++;
    if(c.r===1)c.i=1; else if(c.r===2)c.i=3; else c.i=Math.round(c.i*c.e);
    if(g===1)c.i=Math.max(1,Math.round(c.i*0.7));
    if(g===3)c.i=Math.round(c.i*1.3);
    c.e=Math.min(2.8,Math.max(1.3,c.e+0.1+(g-2)*0.1));
    c.d=today()+Math.max(1,c.i);
    if(g>=2)c.w=0;
  }
  if(fresh&&g>0)S.todayNew++;
  tick();save();
}
function mastered(c){return c&&c.r>=2&&c.i>=7;}
function cardOf(k){return S.cards[k]||{e:2.5,i:0,r:0,l:0,d:0};}

/* ---------- 范围筛选 ---------- */
let scope={book:0,unit:0};
function inScope(a){
  if(scope.book&&a.book!==scope.book)return false;
  if(scope.unit){const l=LMAP[a.lid];if(l.unit!==scope.unit)return false;}
  return true;
}
function buildFilters(){
  const fb=document.getElementById('fBook');
  fb.innerHTML='<option value="0">全部四册</option>'+[1,2,3,4].map(b=>'<option value="'+b+'">第'+CN[b]+'册</option>').join('');
  fb.value=scope.book;
  fb.onchange=()=>{scope.book=+fb.value;scope.unit=0;buildUnits();refreshAll();};
  buildUnits();
}
function buildUnits(){
  const fu=document.getElementById('fUnit');
  let opts='<option value="0">全部单元</option>';
  if(scope.book){
    const seen={};
    DATA.forEach(l=>{if(l.book===scope.book&&!seen[l.unit]){seen[l.unit]=1;
      opts+='<option value="'+l.unit+'">第'+CN[l.unit]+'单元 '+l.unitName+'</option>';}});
  }
  fu.innerHTML=opts;fu.value=scope.unit;
  fu.onchange=()=>{scope.unit=+fu.value;refreshAll();};
}

/* ---------- 队列 ---------- */
let errMode=false;
function queue(){
  if(errMode){
    return shuffle(ATOMS.filter(a=>inScope(a)&&S.cards[a.k]&&S.cards[a.k].w));
  }
  const t=today(),due=[],fresh=[];
  ATOMS.forEach(a=>{ if(!inScope(a))return;
    const c=S.cards[a.k];
    if(!c||c.r===0)fresh.push(a); else if(c.d<=t)due.push(a);});
  const lim=Math.max(0,(S.settings.dailyNew||20)-S.todayNew);
  return shuffle(due.concat(fresh.slice(0,lim)));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(arr,n){return shuffle(arr.slice()).slice(0,n);}

/* ---------- 视图切换 ---------- */
let view='study';
function setView(v){
  view=v;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
  ['study','locate','group','find','stat'].forEach(w=>
    document.getElementById('v-'+w).classList.toggle('hidden',w!==v));
  document.getElementById('filters').classList.toggle('hidden',v==='stat');
  document.getElementById('btnPrint').style.display = v==='find'?'block':'none';
  refreshAll();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
function refreshAll(){
  paintBadges();
  if(view==='study')sRender();
  if(view==='stat')stRender();
  if(view==='find')fRenderTree();
}

/* ---------- 徽章 ---------- */
function paintBadges(){
  const q=queue();
  let dueN=0;ATOMS.forEach(a=>{const c=S.cards[a.k];if(c&&c.r>0&&c.d<=today()&&inScope(a))dueN++;});
  let m=0;ATOMS.forEach(a=>{if(inScope(a)&&mastered(S.cards[a.k]))m++;});
  document.getElementById('badges').innerHTML=
    '<span class="badge">今日待练 '+q.length+'</span>'+
    '<span class="badge">待复习 '+dueN+'</span>'+
    '<span class="badge">已掌握 '+m+'</span>'+
    '<span class="badge">连续 '+(S.streak||0)+' 天</span>';
  document.getElementById('totN').textContent=ATOMS.length;
}

/* ---------- 闪卡 ---------- */
let sq=[],si=0,sFlipped=false;
function sRender(){
  document.getElementById('errBar').style.display=errMode?'flex':'none';
  if(si>=sq.length){sq=queue();si=0;}
  if(!sq.length){
    document.getElementById('sProgress').textContent='';
    document.getElementById('sCount').textContent=errMode?'':'今日新学 '+S.todayNew+' / '+(S.settings.dailyNew||20);
    document.getElementById('sCard').innerHTML=errMode
      ? '<div class="big">错题这一轮清完啦 🎉</div>'+
        '<div class="qhint">在闪卡里按「记住」的考点已自动移出错题本。之后答错的新考点，会回到「统计 → 错题重练」里等你。</div>'
      : '<div class="big">今日这一轮练完了 \uD83C\uDF89</div>'+
        '<div class="qhint">明天再来，或者去「定位」「归类」换种练法，也可以到「统计」看看哪几个单元最弱。</div>';
    document.getElementById('sFlip').style.display='none';
    document.getElementById('sGrade').style.display='none';
    return;
  }
  const a=sq[si];sFlipped=false;
  document.getElementById('sProgress').textContent='第 '+(si+1)+' / '+sq.length+' 张';
  document.getElementById('sCount').textContent='今日新学 '+S.todayNew+' / '+(S.settings.dailyNew||20);
  const c=cardOf(a.k);
  document.getElementById('sCard').innerHTML=
    '<div class="qhint">它属于哪一册、哪个单元、哪一课？</div>'+
    '<div class="big" id="sWord">'+esc(a.text)+'</div>'+
    '<div id="sBack" class="hidden">'+
      '<div class="path">'+pathOf(a)+'<br><span class="u">'+esc(fullUnit(LMAP[a.lid]))+'</span></div>'+
      itemList(LMAP[a.lid].items,a.idx)+
    '</div>';
  document.getElementById('sFlip').style.display='';
  document.getElementById('sGrade').style.display='none';
}
function itemList(items,hi){
  return '<ul class="items">'+items.map((x,i)=>
    '<li class="'+(i===hi?'hi':'')+'">'+esc(x)+'</li>').join('')+'</ul>';
}
document.getElementById('sFlip').onclick=()=>{
  const b=document.getElementById('sBack');if(!b||!b.classList.contains('hidden'))return;
  b.classList.remove('hidden');sFlipped=true;
  document.getElementById('sGrade').style.display='flex';
  document.getElementById('sFlip').style.display='none';
};
document.querySelectorAll('#sGrade .btn').forEach(b=>b.onclick=()=>{
  if(!sFlipped)return;
  review(sq[si].k,+b.dataset.g);si++;sRender();
});
document.addEventListener('keydown',e=>{
  if(view!=='study')return;
  if(e.code==='Space'){e.preventDefault();document.getElementById('sFlip').click();}
  if(['1','2','3'].includes(e.key)){const b=document.querySelector('#sGrade .btn[data-g="'+(e.key-1)+'"]');if(b)b.click();}
});

/* ---------- 定位 ---------- */
let lq=[],li=0,lOK=0,lDone=0,lAns=null,lPicked=false;
function lStart(){
  let pool=ATOMS.filter(inScope);
  if(!pool.length)pool=ATOMS;
  lq=pick(pool,10);
  li=0;lOK=0;lDone=0;lRender();
}
function lRender(){
  if(li>=lq.length){
    document.getElementById('lQ').textContent='本组完成：'+lOK+' / '+lDone;
    document.getElementById('lOpts').innerHTML='';
    document.getElementById('lFB').innerHTML='<div class="note">正确率 '+Math.round(lOK/lDone*100)+'%。低于 80% 就把错的点加到「统计 → 错得最多」里再过一遍。</div>';
    document.getElementById('lNext').style.display='none';
    document.getElementById('lProgress').textContent='';
    return;
  }
  const a=lq[li],l=LMAP[a.lid];
  lPicked=false;
  document.getElementById('lProgress').textContent='第 '+(li+1)+' / '+lq.length+' 题';
  document.getElementById('lScore').textContent='本组 '+lOK+' / '+lDone;
  document.getElementById('lQ').textContent=a.text;
  const same=DATA.filter(x=>x.book===l.book&&x.id!==l.id);
  const other=DATA.filter(x=>x.book!==l.book);
  const opts=shuffle([l].concat(pick(same,2)).concat(pick(other,1)));
  lAns=l.id;
  document.getElementById('lOpts').innerHTML=opts.map(o=>
    '<button class="btn" data-id="'+o.id+'">'+optOf(o)+'</button>').join('');
  document.getElementById('lOpts').querySelectorAll('.btn').forEach(b=>b.onclick=()=>lAnswer(b));
  document.getElementById('lFB').innerHTML='';
  document.getElementById('lNext').style.display='none';
}
function lAnswer(b){
  if(lPicked)return;lPicked=true;
  const a=lq[li],id=b.dataset.id,ok=id===lAns;
  lDone++;if(ok)lOK++;
  document.querySelectorAll('#lOpts .btn').forEach(x=>{
    if(x.dataset.id===lAns)x.classList.add('correct');
    else if(x===b)x.classList.add('wrong');
  });
  const l=LMAP[a.lid];
  document.getElementById('lFB').innerHTML=(ok?'<div style="color:var(--green);font-weight:600;margin-top:12px">✓ 答对了</div>'
      :'<div style="color:var(--red);font-weight:600;margin-top:12px">✗ 正确位置：'+pathOf(a)+'</div>')
    +'<div class="path" style="margin-top:6px">'+esc(fullUnit(l))+'</div>'
    +itemList(l.items,a.idx);
  review(a.k,ok?2:0);
  document.getElementById('lNext').style.display='block';
  paintBadges();
}
document.getElementById('lNext').onclick=()=>{li++;lRender();};
document.getElementById('lStart').onclick=()=>{lStart();};

/* ---------- 归类 ---------- */
let gq=[],gi=0,gOK=0,gDone=0,gSel=new Set(),gLesson=null;
function gStart(){
  let pool=DATA.filter(l=>inScope({book:l.book,unit:l.unit,lid:l.id}));
  if(!pool.length)pool=DATA;
  gq=pick(pool,8);gi=0;gOK=0;gDone=0;gRender();
}
function gRender(){
  if(gi>=gq.length){
    document.getElementById('gQ').textContent='本组完成：'+gOK+' / '+gDone;
    document.getElementById('gOpts').innerHTML='';
    document.getElementById('gFB').innerHTML='<div class="note">这类题练的是「顺着目录回忆内容」，是考试翻书定位的反向能力。</div>';
    document.getElementById('gSubmit').style.display='none';
    document.getElementById('gNext').style.display='none';
    return;
  }
  const l=gq[gi];gLesson=l;gSel=new Set();
  document.getElementById('gProgress').textContent='第 '+(gi+1)+' / '+gq.length+' 课';
  document.getElementById('gScore').textContent='本组 '+gOK+' / '+gDone;
  document.getElementById('gQ').innerHTML='第'+CN[l.book]+'册 › 第'+CN[l.unit]+'单元 '+l.unitName+' › 第'+l.lesson+'课'
    +'<br><span class="u" style="font-weight:400;color:var(--sub)">'+esc(fullUnit(l))+'</span>';
  const right=l.items.length>5?pick(l.items,5):l.items;
  const sib=DATA.filter(x=>x.book===l.book&&x.unit===l.unit&&x.id!==l.id);
  const wrongs=[];sib.forEach(x=>pick(x.items,2).forEach(w=>wrongs.push({t:w,ok:false})));
  const all=shuffle(right.map(t=>({t:t,ok:true})).concat(pick(wrongs,4)));
  document.getElementById('gOpts').innerHTML=all.map((o,i)=>
    '<button class="btn" data-i="'+i+'" data-ok="'+(o.ok?1:0)+'">'+esc(o.t)+'</button>').join('');
  document.getElementById('gOpts').querySelectorAll('.btn').forEach(b=>b.onclick=()=>{
    b.classList.toggle('sel');
    if(b.classList.contains('sel'))gSel.add(b.dataset.i);else gSel.delete(b.dataset.i);
    document.getElementById('gSel').textContent=gSel.size;
  });
  document.getElementById('gSel').textContent='0';
  document.getElementById('gFB').innerHTML='';
  document.getElementById('gSubmit').style.display='block';
  document.getElementById('gNext').style.display='none';
}
document.getElementById('gSubmit').onclick=()=>{
  const btns=[...document.querySelectorAll('#gOpts .btn')];
  let allRight=true;
  btns.forEach(b=>{
    const ok=b.dataset.ok==='1',sel=b.classList.contains('sel');
    if(ok&&sel)b.classList.add('correct');
    else if(!ok&&sel){b.classList.add('wrong');allRight=false;}
    else if(ok&&!sel){b.classList.add('correct');allRight=false;}
  });
  gDone++;if(allRight)gOK++;
  const l=gLesson;
  document.getElementById('gFB').innerHTML=(allRight?'<div style="color:var(--green);font-weight:600;margin-top:12px">✓ 全对</div>'
    :'<div style="color:var(--red);font-weight:600;margin-top:12px">✗ 漏了或选错了，完整清单如下</div>')
    +itemList(l.items,-1);
  l.items.forEach((_,i)=>review(l.id+'#'+i,allRight?2:0));
  document.getElementById('gSubmit').style.display='none';
  document.getElementById('gNext').style.display='block';
  paintBadges();
};
document.getElementById('gNext').onclick=()=>{gi++;gRender();};
document.getElementById('gStart').onclick=()=>{gStart();};

/* ---------- 检索 ---------- */
document.getElementById('fq').oninput=e=>{
  const q=e.target.value.trim();
  const box=document.getElementById('fRes');
  if(!q){box.innerHTML='';return;}
  const hits=ATOMS.filter(a=>a.text.includes(q)||pathOf(a).includes(q)).slice(0,40);
  box.innerHTML='<div class="card"><b>命中 '+hits.length+' 条</b>'+
    hits.map(a=>'<div class="hit"><span class="t">'+esc(a.text)+'</span>'+
      '<div class="path">'+pathOf(a)+'</div></div>').join('')+'</div>';
};
function fRenderTree(){
  const box=document.getElementById('fTree');
  let h='';
  [1,2,3,4].forEach(b=>{
    if(scope.book&&scope.book!==b)return;
    const ls=DATA.filter(l=>l.book===b);
    h+='<details'+(scope.book?' open':'')+'><summary>第'+CN[b]+'册（'+ls.length+'课）</summary>';
    const us={};ls.forEach(l=>{if(!us[l.unit])us[l.unit]=[];us[l.unit].push(l);});
    Object.keys(us).forEach(u=>{
      if(scope.unit&&scope.unit!=u)return;
      h+='<div style="margin:8px 0 2px;color:var(--sub);font-size:13.5px">第'+CN[u]+'单元 · '+us[u][0].unitName+'</div>';
      us[u].forEach(l=>{
        h+='<details style="padding:4px 0"><summary style="font-weight:500;font-size:14.5px">第'+l.lesson+'课</summary>'+itemList(l.items,-1)+'</details>';
      });
    });
    h+='</details>';
  });
  box.innerHTML=h+ '<div class="row"><button class="btn primary" onclick="window.print()">打印默写纸（留白）</button></div>';
  buildPrint();
}
function buildPrint(){
  let h='<h2 style="text-align:center">历史考点定位 · 默写纸</h2><table>';
  DATA.filter(l=>!scope.book||l.book===scope.book).forEach(l=>{
    h+='<tr><td style="width:36%">第'+CN[l.book]+'册 第'+CN[l.unit]+'单元 · 第'+l.lesson+'课</td><td></td><td></td></tr>';
  });
  h+='</table>';
  document.getElementById('printArea').innerHTML=h;
}
document.getElementById('btnPrint').textContent='打印默写纸';
document.getElementById('btnPrint').onclick=()=>window.print();
document.getElementById('btnPrint').className='btn';
document.getElementById('btnPrint').style.width='auto';

/* ---------- 统计 ---------- */
function stRender(){
  let learned=0,mas=0,due=0,errCnt=0;
  ATOMS.forEach(a=>{const c=S.cards[a.k];if(inScope(a)){
    if(c&&c.r>0)learned++;
    if(mastered(c))mas++;
    if(c&&c.r>0&&c.d<=today())due++;
    if(c&&c.w)errCnt++;}});
  const tot=ATOMS.filter(inScope).length;
  document.getElementById('stNums').innerHTML=
    '<div class="stat"><b>'+learned+'</b><span>已接触 / '+tot+'</span></div>'+
    '<div class="stat"><b>'+mas+'</b><span>已掌握（7天+）</span></div>'+
    '<div class="stat"><b>'+due+'</b><span>今日待复习</span></div>';
  let bh='';
  [1,2,3,4].forEach(b=>{
    const as=ATOMS.filter(a=>a.book===b);
    const m=as.filter(a=>mastered(S.cards[a.k])).length;
    const p=Math.round(m/as.length*100);
    bh+='<div style="margin-bottom:9px"><div style="display:flex;justify-content:space-between;font-size:14px">'+
      '<span>第'+CN[b]+'册</span><span style="color:var(--sub)">'+m+' / '+as.length+' · '+p+'%</span></div>'+
      '<div class="bar"><i style="width:'+p+'%"></i></div></div>';
  });
  document.getElementById('stBooks').innerHTML=bh;
  const um={};
  DATA.forEach(l=>{const k=l.book+'-'+l.unit;
    um[k]=um[k]||{name:'第'+CN[l.book]+'册 第'+CN[l.unit]+'单元 '+l.unitName,t:0,m:0};
    l.items.forEach((_,i)=>{um[k].t++;if(mastered(S.cards[l.id+'#'+i]))um[k].m++;});});
  const arr=Object.values(um).map(x=>({...x,r:x.t?x.m/x.t:0})).sort((a,b)=>a.r-b.r).slice(0,8);
  document.getElementById('stWeak').innerHTML=arr.map(x=>
    '<div class="weak"><span>'+x.name+'</span><span>'+Math.round(x.r*100)+'%</span></div>').join('');
  const lp=ATOMS.map(a=>({a:a,c:S.cards[a.k]})).filter(x=>x.c&&x.c.l>0)
    .sort((x,y)=>y.c.l-x.c.l).slice(0,15);
  document.getElementById('stLapse').innerHTML= lp.length? lp.map(x=>
    '<div class="weak"><span>'+esc(x.a.text)+'<div class="path" style="font-size:12.5px">'+pathOf(x.a)+'</div></span>'+
    '<span>错'+x.c.l+'次</span></div>').join('') : '<div style="color:var(--sub);font-size:14px">还没有错题记录，先去练一组。</div>';
  document.getElementById('setNew').value=S.settings.dailyNew||20;
  document.getElementById('errN').textContent=errCnt;
  document.getElementById('btnError').style.display=errCnt?'block':'none';
}
document.getElementById('btnError').onclick=()=>{errMode=true;setView('study');};
document.getElementById('errExit').onclick=()=>{errMode=false;sRender();};
document.getElementById('setNew').onchange=e=>{S.settings.dailyNew=+e.target.value;save();refreshAll();};
document.getElementById('btnExport').onclick=()=>{
  const b=new Blob([JSON.stringify(S)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='历史复习进度.json';a.click();
};
document.getElementById('btnImport').onclick=()=>document.getElementById('fileIn').click();
document.getElementById('fileIn').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{S=JSON.parse(r.result);if(!S.settings)S.settings={dailyNew:20};save();applyTheme();refreshAll();alert('导入成功');}catch(x){alert('文件格式不对');}};
  r.readAsText(f);
};
document.getElementById('btnReset').onclick=()=>{
  if(confirm('确定清空所有进度？建议先导出备份。')){
    S={cards:{},settings:{dailyNew:20},day:today(),todayNew:0,log:{},streak:0,lastDay:0};
    S.settings.theme=S.settings.theme||'light';errMode=false;save();applyTheme();refreshAll();}
};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- 启动 ---------- */
rollDay();applyTheme();buildFilters();refreshAll();sRender();
</script>
